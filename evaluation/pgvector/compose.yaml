services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cms_rag
      POSTGRES_USER: cms_rag
      POSTGRES_PASSWORD: cms_rag_eval
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_rag -d cms_rag"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
